# Dev-only static server for the single-page game.
# Serves the bind-mounted source files directly; no caching so edits appear on refresh.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
