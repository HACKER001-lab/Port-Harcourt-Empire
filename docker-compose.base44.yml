services:
  web:
    image: nginx:alpine
    labels:
      base44.project: "Garden City: Reign"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      # Bind-mount the actual source files so edits show on refresh (no rebuild).
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./branding.js:/usr/share/nginx/html/branding.js:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - BASE44_PREVIEW_MODE
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
